# Cookbook: generic Docker Compose setup (any Docker host).
# For TrueNAS SCALE use truenas-app.yaml instead (see TRUENAS.md).
name: cookbook

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cookbook
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook -d cookbook"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: cookbook:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://cookbook:${POSTGRES_PASSWORD}@db:5432/cookbook
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      TZ: ${TZ:-UTC}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - ./data/app:/data
    ports:
      - "${COOKBOOK_PORT:-8080}:8000"
